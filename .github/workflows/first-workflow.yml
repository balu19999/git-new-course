name : second-workflow
on : push
jobs:
  first-job:
    runs-on:ubuntu-latest
    steps:
      -name:get code
       uses:actions/checkout@v3
      -name:Install NodeJs
       uses:actions/setup-node@v3
       with:
        node-version: 18
      -name:Install dependencies
       run:npm ci
      -name:run tests
       run:npm test   
